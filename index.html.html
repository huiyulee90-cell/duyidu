<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="读一读">
<meta name="theme-color" content="#7F77DD">
<title>读一读 · Dú Yī Dú</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
:root {
  --purple:#7F77DD; --purple-light:#EEEDFE; --purple-mid:#534AB7;
  --green:#1D9E75; --green-light:#E1F5EE;
  --amber-light:#FAEEDA; --amber:#854F0B;
  --bg:#FAFAF9; --surface:#FFFFFF;
  --border:rgba(0,0,0,0.1); --text:#1a1a1a;
  --text-muted:#6b6b6b; --text-hint:#9b9b9b;
  --radius:16px; --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
#app{height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(30px);transition:opacity 0.22s ease,transform 0.22s ease;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen.active{opacity:1;pointer-events:all;transform:translateX(0);}
.screen.exit{opacity:0;transform:translateX(-30px);}
.app-bar{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:10;}
.app-bar-title{font-size:17px;font-weight:500;color:var(--text);}
.back-btn{background:none;border:none;cursor:pointer;color:var(--purple);font-size:22px;line-height:1;display:flex;align-items:center;}
/* HOME */
.home-body{flex:1;display:flex;flex-direction:column;padding:0 20px 40px;}
.hero{text-align:center;padding:40px 20px 28px;}
.hero-icon{width:80px;height:80px;background:var(--purple-light);border-radius:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:40px;}
.hero h1{font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.3;}
.hero p{font-size:14px;color:var(--text-muted);line-height:1.6;}
.primary-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;background:var(--purple);color:white;border:none;border-radius:var(--radius);font-size:17px;font-weight:500;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:transform 0.1s,opacity 0.1s;}
.primary-btn:active{transform:scale(0.97);opacity:0.9;}
.primary-btn svg{width:22px;height:22px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider-line{flex:1;height:1px;background:var(--border);}
.divider span{font-size:13px;color:var(--text-hint);}
.secondary-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);font-size:16px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:transform 0.1s,background 0.1s;}
.secondary-btn:active{transform:scale(0.97);background:var(--bg);}
.secondary-btn svg{width:20px;height:20px;fill:none;stroke:var(--text-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tip-card{margin-top:24px;background:var(--purple-light);border-radius:var(--radius-sm);padding:14px 16px;font-size:13px;color:var(--purple-mid);line-height:1.6;}
.tip-card strong{font-weight:500;display:block;margin-bottom:4px;}
/* CAMERA */
.camera-viewport{flex:1;background:#0d0d1a;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:300px;}
.camera-viewport video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.camera-overlay{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;}
.camera-hint-text{color:rgba(255,255,255,0.8);font-size:13px;}
.viewfinder{width:240px;height:150px;border:2px solid rgba(255,255,255,0.5);border-radius:8px;position:relative;}
.vf-corner{position:absolute;width:20px;height:20px;}
.vf-corner.tl{top:-2px;left:-2px;border-top:3px solid white;border-left:3px solid white;border-radius:4px 0 0 0;}
.vf-corner.tr{top:-2px;right:-2px;border-top:3px solid white;border-right:3px solid white;border-radius:0 4px 0 0;}
.vf-corner.bl{bottom:-2px;left:-2px;border-bottom:3px solid white;border-left:3px solid white;border-radius:0 0 0 4px;}
.vf-corner.br{bottom:-2px;right:-2px;border-bottom:3px solid white;border-right:3px solid white;border-radius:0 0 4px 0;}
.camera-controls{background:#0d0d1a;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.cam-side{width:52px;}
.shutter-btn{width:72px;height:72px;border-radius:50%;background:white;border:5px solid rgba(255,255,255,0.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;}
.shutter-btn:active{transform:scale(0.93);}
.shutter-inner{width:56px;height:56px;background:white;border-radius:50%;border:2px solid rgba(0,0,0,0.12);}
#fileInput{display:none;}
.gallery-btn{width:52px;height:52px;border-radius:10px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:white;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:2px;}
.gallery-btn svg{width:20px;height:20px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;}
.gallery-btn span{font-size:10px;color:rgba(255,255,255,0.7);}
/* PROCESSING */
.processing-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;gap:28px;}
.scan-preview{width:120px;height:80px;background:var(--purple-light);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;}
.scan-preview img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm);}
.spinner-ring{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.step-list{width:100%;display:flex;flex-direction:column;gap:12px;}
.step-row{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--text-hint);transition:color 0.3s;}
.step-row.done{color:var(--text);}
.step-row.active{color:var(--purple);font-weight:500;}
.step-icon{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:all 0.3s;}
.step-row.done .step-icon{background:var(--green-light);border-color:var(--green);}
.step-row.active .step-icon{background:var(--purple-light);border-color:var(--purple);}
.error-msg{color:#A32D2D;background:#FCEBEB;border-radius:var(--radius-sm);padding:14px 16px;font-size:14px;line-height:1.6;text-align:center;display:none;}
/* READ */
.read-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.passage-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 12px;}
.passage-meta{font-size:11px;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:14px;}
.chinese-text{font-size:26px;line-height:2.5;color:var(--text);display:flex;flex-wrap:wrap;align-items:baseline;}
.char{display:inline-block;border-radius:6px;padding:1px 3px;transition:background 0.06s,color 0.06s;cursor:pointer;}
.char.highlighted{background:var(--purple-light);color:var(--purple-mid);font-weight:700;}
.char.read{color:var(--text-hint);}
.player-panel{background:var(--surface);border-top:1px solid var(--border);padding:16px 20px 32px;flex-shrink:0;}
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.pct-label{font-size:12px;color:var(--text-hint);min-width:32px;text-align:right;}
.progress-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--purple);border-radius:2px;width:0%;transition:width 0.1s;}
.player-controls{display:flex;align-items:center;justify-content:space-between;}
.ctrl-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:8px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background 0.15s;}
.ctrl-btn:active{background:var(--bg);}
.ctrl-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.play-pause-btn{width:56px;height:56px;border-radius:50%;background:var(--purple);color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;box-shadow:0 4px 16px rgba(127,119,221,0.35);}
.play-pause-btn:active{transform:scale(0.94);}
.play-pause-btn svg{width:24px;height:24px;fill:white;stroke:none;}
.speed-chips{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap;}
.speed-chip{font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all 0.15s;}
.speed-chip.active{background:var(--purple-light);color:var(--purple-mid);border-color:rgba(127,119,221,0.4);font-weight:500;}
.tts-warning{margin:0 20px 12px;padding:12px 14px;background:var(--amber-light);border-radius:var(--radius-sm);font-size:13px;color:var(--amber);line-height:1.5;display:none;}
::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div class="screen active" id="s-home">
  <div class="app-bar"><span class="app-bar-title">读一读 · Dú Yī Dú</span></div>
  <div class="home-body">
    <div class="hero">
      <div class="hero-icon">📖</div>
      <h1>扫描课文，<br>一起来读！</h1>
      <p>拍一张课文或功课的照片<br>App 会帮你朗读，每个字同步高亮。</p>
    </div>
    <button class="primary-btn" onclick="openCamera()">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      拍照扫描
    </button>
    <div class="divider"><div class="divider-line"></div><span>或</span><div class="divider-line"></div></div>
    <button class="secondary-btn" onclick="document.getElementById('fileInput').click()">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      从相册选择
    </button>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
    <div class="tip-card">
      <strong>💡 怎么用？</strong>
      对准课本或功课的中文段落拍照，App 会朗读每一个字，同步高亮显示，帮助跟读练习。
    </div>
  </div>
</div>

<!-- CAMERA -->
<div class="screen" id="s-camera">
  <div class="camera-viewport" id="cameraViewport">
    <video id="videoEl" autoplay playsinline muted></video>
    <div class="camera-overlay">
      <div class="camera-hint-text">对准中文课文</div>
      <div class="viewfinder">
        <div class="vf-corner tl"></div><div class="vf-corner tr"></div>
        <div class="vf-corner bl"></div><div class="vf-corner br"></div>
      </div>
      <div class="camera-hint-text" style="font-size:12px;opacity:0.7;">保持稳定，光线要充足</div>
    </div>
    <canvas id="captureCanvas" style="display:none;"></canvas>
  </div>
  <div class="camera-controls">
    <button class="back-btn cam-side" style="color:white;" onclick="stopCamera();go('s-home')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap:round stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="shutter-btn" onclick="capturePhoto()">
      <div class="shutter-inner"></div>
    </button>
    <label class="gallery-btn cam-side" for="fileInput">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>相册</span>
    </label>
  </div>
</div>

<!-- PROCESSING -->
<div class="screen" id="s-processing">
  <div class="app-bar"><span class="app-bar-title">识别中…</span></div>
  <div class="processing-body">
    <div class="scan-preview" id="scanPreview">📄</div>
    <div class="spinner-ring" id="procSpinner"></div>
    <div class="step-list">
      <div class="step-row" id="st1"><div class="step-icon">1</div><span>上传图片</span></div>
      <div class="step-row" id="st2"><div class="step-icon">2</div><span>OCR 识别文字</span></div>
      <div class="step-row" id="st3"><div class="step-icon">3</div><span>整理段落</span></div>
      <div class="step-row" id="st4"><div class="step-icon">4</div><span>准备朗读</span></div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- READ ALONG -->
<div class="screen" id="s-read">
  <div class="app-bar">
    <button class="back-btn" onclick="stopAll();go('s-home')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="app-bar-title">跟读练习</span>
  </div>
  <div class="read-body">
    <div class="passage-wrap">
      <div class="passage-meta">已扫描 · 点击任何一个字可跳转</div>
      <div class="chinese-text" id="chineseText"></div>
    </div>
    <div id="ttsWarning" class="tts-warning">
      ⚠️ 请用 iPhone Safari 或 Android Chrome 打开，以支持中文朗读。
    </div>
    <div class="player-panel">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="pct-label" id="pctLabel">0%</span>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn" title="从头再来" onclick="restartReading()">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
        </button>
        <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlay()">
          <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="ctrl-btn" title="慢速重读" onclick="rewind()">
          <svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
        </button>
      </div>
      <div class="speed-chips">
        <button class="speed-chip active" onclick="setSpeed(0.5,this)">很慢 ×0.5</button>
        <button class="speed-chip" onclick="setSpeed(0.7,this)">慢 ×0.7</button>
        <button class="speed-chip" onclick="setSpeed(1.0,this)">正常</button>
        <button class="speed-chip" onclick="setSpeed(1.2,this)">快 ×1.2</button>
      </div>
    </div>
  </div>
</div>

</div><!-- #app -->

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Paste your Google Cloud Vision API key here after you get it:
const GOOGLE_VISION_API_KEY = 'AIzaSyAlQi0CiHtnIwdEOqBTsdgMEM6NExHKCzM';

// ─── STATE ────────────────────────────────────────────────────────────────────
let passage = '';
let chars = [];           // array of {char, el, startMs, endMs}
let isPlaying = false;
let currentSpeed = 0.5;
let utterance = null;
let cameraStream = null;
let animFrame = null;
let speechStartTime = 0;
let totalDurationMs = 0;
let charTimings = [];     // [{startMs, endMs}] parallel to passage chars
let currentHighlightIdx = -1;

const PUNCT = new Set(['。','，','？','！','、','；','：','…','—','「','」','『','』','（','）',' ','\n']);

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function go(id) {
  document.querySelectorAll('.screen').forEach(s => {
    if (s.classList.contains('active')) { s.classList.add('exit'); s.classList.remove('active'); }
  });
  setTimeout(() => {
    document.querySelectorAll('.screen.exit').forEach(s => s.classList.remove('exit'));
    document.getElementById(id).classList.add('active');
  }, 60);
}

// ─── CAMERA ───────────────────────────────────────────────────────────────────
async function openCamera() {
  go('s-camera');
  await new Promise(r => setTimeout(r, 300));
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width:{ideal:1920}, height:{ideal:1080} }
    });
    document.getElementById('videoEl').srcObject = cameraStream;
  } catch(e) {
    alert('无法访问摄像头。请允许相机权限，或点击"从相册选择"。');
    go('s-home');
  }
}

function stopCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
}

function capturePhoto() {
  const video = document.getElementById('videoEl');
  const canvas = document.getElementById('captureCanvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataURL = canvas.toDataURL('image/jpeg', 0.9);
  stopCamera();
  runOCR(dataURL);
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => runOCR(ev.target.result);
  reader.readAsDataURL(file);
  e.target.value = '';
}

// ─── OCR ──────────────────────────────────────────────────────────────────────
async function runOCR(dataURL) {
  go('s-processing');
  const preview = document.getElementById('scanPreview');
  preview.innerHTML = `<img src="${dataURL}" alt="扫描图片">`;
  document.getElementById('errorMsg').style.display = 'none';

  const steps = ['st1','st2','st3','st4'];
  steps.forEach((id,i) => {
    const el = document.getElementById(id);
    el.className = 'step-row';
    el.querySelector('.step-icon').textContent = i+1;
  });

  function setStep(n, state) {
    const el = document.getElementById('st'+n);
    el.className = 'step-row ' + state;
    if (state === 'done') el.querySelector('.step-icon').textContent = '✓';
  }

  try {
    setStep(1, 'active');
    // Convert dataURL to base64
    const base64 = dataURL.split(',')[1];
    await delay(400);
    setStep(1, 'done'); setStep(2, 'active');

    let extractedText = '';

    if (GOOGLE_VISION_API_KEY && GOOGLE_VISION_API_KEY !== 'YOUR_GOOGLE_VISION_API_KEY') {
      // Real OCR via Google Cloud Vision
      const response = await fetch(
        `https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_VISION_API_KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            requests: [{
              image: { content: base64 },
              features: [{ type: 'TEXT_DETECTION', maxResults: 1 }],
              imageContext: { languageHints: ['zh-Hans', 'zh-Hant'] }
            }]
          })
        }
      );
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      const annotation = data.responses[0].textAnnotations;
      if (!annotation || annotation.length === 0) throw new Error('未能识别到文字。请确保图片清晰、光线充足。');
      extractedText = annotation[0].description.trim();
    } else {
      // Demo fallback when no API key is set
      await delay(800);
      extractedText = '小明每天早上都会读书。他非常努力，老师很喜欢他。同学们也很喜欢和他一起玩。';
    }

    setStep(2, 'done'); setStep(3, 'active');
    // Clean up text: remove spaces between Chinese chars, keep punctuation
    extractedText = cleanChineseText(extractedText);
    await delay(350);
    setStep(3, 'done'); setStep(4, 'active');
    await delay(350);
    setStep(4, 'done');
    await delay(300);

    go('s-read');
    buildPassage(extractedText);

  } catch(err) {
    document.getElementById('procSpinner').style.display = 'none';
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'block';
    errEl.textContent = '识别失败：' + (err.message || '请重试。');
  }
}

function cleanChineseText(text) {
  // Keep ONLY CJK characters and Chinese punctuation.
  // Strips ALL Latin letters including tone-marked pinyin (e.g. ā á ǎ à ē é ě etc),
  // numbers, spaces, English punctuation — everything non-Chinese.
  const chinesePunct = new Set(['。','，','？','！','、','；','：','…','—','「','」','『','』','（','）','·']);
  const chineseOnly = text.split('').filter(ch => {
    const code = ch.codePointAt(0);
    if (code >= 0x4E00 && code <= 0x9FFF) return true;   // CJK Unified Ideographs
    if (code >= 0x3400 && code <= 0x4DBF) return true;   // CJK Extension A
    if (code >= 0x20000 && code <= 0x2A6DF) return true; // CJK Extension B
    if (chinesePunct.has(ch)) return true;
    // Drop everything else: Latin a-z, accented pinyin, numbers, symbols
    return false;
  }).join('');
  return chineseOnly.trim();
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── BUILD PASSAGE ────────────────────────────────────────────────────────────
function buildPassage(text) {
  passage = text;
  chars = [];
  currentHighlightIdx = -1;
  isPlaying = false;
  updatePlayIcon(false);
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('pctLabel').textContent = '0%';

  const el = document.getElementById('chineseText');
  el.innerHTML = '';
  text.split('').forEach((ch, i) => {
    if (ch === '\n') { el.appendChild(document.createElement('br')); return; }
    const span = document.createElement('span');
    span.id = 'c' + i;
    span.className = 'char';
    span.textContent = ch;
    span.onclick = () => seekTo(i);
    el.appendChild(span);
    chars.push({ ch, el: span, idx: i });
  });
}

// ─── PLAYBACK ─────────────────────────────────────────────────────────────────
function togglePlay() {
  if (isPlaying) { pauseAll(); return; }
  // If at end, restart
  if (currentHighlightIdx >= chars.length - 1) restartReading();
  else startSpeaking(currentHighlightIdx < 0 ? 0 : currentHighlightIdx);
}

function startSpeaking(fromCharIdx) {
  if (!window.speechSynthesis) {
    document.getElementById('ttsWarning').style.display = 'block';
    return;
  }
  cancelSpeech();
  isPlaying = true;
  updatePlayIcon(true);

  // Build the text slice from fromCharIdx
  const textSlice = chars.slice(fromCharIdx).map(c => c.ch).join('');

  utterance = new SpeechSynthesisUtterance(textSlice);
  utterance.lang = 'zh-CN';
  utterance.rate = currentSpeed;
  utterance.pitch = 1.05;

  // Best available Chinese voice
  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang === 'zh-CN' && v.localService)
             || voices.find(v => v.lang === 'zh-CN')
             || voices.find(v => v.lang.startsWith('zh'));
  if (voice) utterance.voice = voice;

  // ── Key fix: use boundary events for accurate sync ──
  // boundary fires with e.charIndex = position in the utterance string
  utterance.onboundary = function(e) {
    if (e.name !== 'word' && e.name !== 'sentence' && e.name !== 'char') {
      // Some browsers fire with name='word', charIndex into the string
      return;
    }
  };

  // We use a different approach: track elapsed time vs estimated char durations
  // This works across all browsers including iOS Safari which ignores boundary events
  utterance.onstart = function() {
    speechStartTime = performance.now();
    // Estimate total duration based on character count and rate
    // ~180ms per Chinese character at rate=1.0, adjusted for rate
    totalDurationMs = estimateDuration(textSlice, currentSpeed);
    charTimings = buildCharTimings(textSlice, currentSpeed);
    runHighlightLoop(fromCharIdx);
  };

  utterance.onend = function() {
    cancelAnimationFrame(animFrame);
    // Mark all remaining as read
    chars.forEach((c,i) => {
      if (i >= fromCharIdx) { c.el.classList.remove('highlighted'); c.el.classList.add('read'); }
    });
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('pctLabel').textContent = '100%';
    isPlaying = false;
    currentHighlightIdx = chars.length - 1;
    updatePlayIcon(false);
  };

  utterance.onerror = function(e) {
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    document.getElementById('ttsWarning').style.display = 'block';
    isPlaying = false;
    updatePlayIcon(false);
  };

  window.speechSynthesis.speak(utterance);
}

function estimateDuration(text, rate) {
  // Base: ~170ms per Chinese char, ~80ms per punctuation at rate=1
  let ms = 0;
  for (const ch of text) {
    if (PUNCT.has(ch)) {
      ms += ['。','？','！'].includes(ch) ? 500 : 200;
    } else {
      ms += 170;
    }
  }
  return ms / rate;
}

function buildCharTimings(text, rate) {
  // Returns array of {startMs, endMs} for each character
  const timings = [];
  let cursor = 0;
  for (const ch of text) {
    let dur;
    if (['。','？','！'].includes(ch)) dur = 500;
    else if (PUNCT.has(ch)) dur = 200;
    else dur = 170;
    dur = dur / rate;
    timings.push({ startMs: cursor, endMs: cursor + dur });
    cursor += dur;
  }
  return timings;
}

function runHighlightLoop(fromCharIdx) {
  cancelAnimationFrame(animFrame);
  const totalChars = chars.length;

  function tick() {
    const elapsed = performance.now() - speechStartTime;
    // Find which char in the slice we're at
    let sliceIdx = 0;
    for (let i = 0; i < charTimings.length; i++) {
      if (elapsed >= charTimings[i].startMs) sliceIdx = i;
      else break;
    }
    const absoluteIdx = fromCharIdx + sliceIdx;

    if (absoluteIdx !== currentHighlightIdx) {
      // Clear old highlight
      if (currentHighlightIdx >= 0 && currentHighlightIdx < chars.length) {
        chars[currentHighlightIdx].el.classList.remove('highlighted');
        chars[currentHighlightIdx].el.classList.add('read');
      }
      // Mark everything before as read (catch-up)
      for (let i = fromCharIdx; i < absoluteIdx; i++) {
        if (i >= 0 && i < chars.length) {
          chars[i].el.classList.remove('highlighted');
          chars[i].el.classList.add('read');
        }
      }
      // Highlight current
      if (absoluteIdx >= 0 && absoluteIdx < chars.length) {
        chars[absoluteIdx].el.classList.remove('read');
        chars[absoluteIdx].el.classList.add('highlighted');
        // Auto-scroll to keep highlighted char visible
        chars[absoluteIdx].el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      currentHighlightIdx = absoluteIdx;

      // Update progress
      const pct = Math.round(((absoluteIdx + 1) / totalChars) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('pctLabel').textContent = pct + '%';
    }

    if (isPlaying) animFrame = requestAnimationFrame(tick);
  }

  animFrame = requestAnimationFrame(tick);
}

function pauseAll() {
  isPlaying = false;
  updatePlayIcon(false);
  cancelAnimationFrame(animFrame);
  if (window.speechSynthesis) window.speechSynthesis.pause();
}

function stopAll() {
  isPlaying = false;
  updatePlayIcon(false);
  cancelAnimationFrame(animFrame);
  cancelSpeech();
}

function cancelSpeech() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

function restartReading() {
  stopAll();
  currentHighlightIdx = -1;
  chars.forEach(c => c.el.classList.remove('highlighted','read'));
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('pctLabel').textContent = '0%';
  setTimeout(() => startSpeaking(0), 100);
}

function seekTo(charIdx) {
  stopAll();
  currentHighlightIdx = charIdx - 1;
  chars.forEach((c, i) => {
    c.el.classList.remove('highlighted','read');
    if (i < charIdx) c.el.classList.add('read');
  });
  const pct = Math.round((charIdx / chars.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('pctLabel').textContent = pct + '%';
  setTimeout(() => startSpeaking(charIdx), 100);
}

function rewind() {
  const newIdx = Math.max(0, (currentHighlightIdx || 0) - 8);
  seekTo(newIdx);
}

function setSpeed(s, btn) {
  currentSpeed = s;
  document.querySelectorAll('.speed-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (isPlaying) {
    const resumeFrom = Math.max(0, currentHighlightIdx);
    stopAll();
    setTimeout(() => startSpeaking(resumeFrom), 100);
  }
}

function updatePlayIcon(playing) {
  const icon = document.getElementById('playIcon');
  icon.innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="5 3 19 12 5 21 5 3"/>';
}

// Init voices
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// Prevent iOS scroll bounce outside scroll areas
document.addEventListener('touchmove', e => {
  if (!e.target.closest('.passage-wrap')) e.preventDefault();
}, { passive: false });
</script>
