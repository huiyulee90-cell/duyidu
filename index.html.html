<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="读一读">
<meta name="theme-color" content="#7F77DD">
<title>读一读</title>
<style>
:root {
  --purple: #7F77DD;
  --purple-light: #EEEDFE;
  --purple-mid: #534AB7;
  --green-light: #E1F5EE;
  --green: #1D9E75;
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --border: rgba(0,0,0,0.1);
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --hint: #9b9b9b;
  --r: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: sans-serif; background: var(--bg); }
#app { height: 100%; max-width: 430px; margin: 0 auto; position: relative; overflow: hidden; }

/* Screens */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transform: translateX(24px);
  transition: opacity 0.2s, transform 0.2s; overflow-y: auto; }
.screen.active { opacity: 1; pointer-events: all; transform: translateX(0); }

/* App bar */
.bar { display: flex; align-items: center; gap: 12px; padding: 16px 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
.bar-title { font-size: 17px; font-weight: 500; }
.back { background: none; border: none; cursor: pointer; color: var(--purple);
  display: flex; align-items: center; padding: 0; }
.back svg { width: 22px; height: 22px; fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Home */
.home-body { flex: 1; display: flex; flex-direction: column; padding: 0 20px 40px; }
.hero { text-align: center; padding: 40px 0 28px; }
.hero-icon { width: 80px; height: 80px; background: var(--purple-light); border-radius: 22px;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px; }
.hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
.hero p { font-size: 14px; color: var(--muted); line-height: 1.6; }
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 18px; background: var(--purple); color: white; border: none;
  border-radius: var(--r); font-size: 17px; font-weight: 500; cursor: pointer; }
.btn-primary svg { width: 22px; height: 22px; fill: none; stroke: white;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-primary:active { opacity: 0.85; }
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
.divider-line { flex: 1; height: 1px; background: var(--border); }
.divider span { font-size: 13px; color: var(--hint); }
.btn-secondary { display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 16px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--r); font-size: 16px; cursor: pointer; }
.btn-secondary svg { width: 20px; height: 20px; fill: none; stroke: var(--muted);
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-secondary:active { background: var(--bg); }
.tip { margin-top: 24px; background: var(--purple-light); border-radius: 10px;
  padding: 14px 16px; font-size: 13px; color: var(--purple-mid); line-height: 1.6; }
.tip strong { display: block; margin-bottom: 4px; }

/* Processing */
.proc-body { flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 32px; gap: 24px; }
.preview-img { width: 120px; height: 80px; background: var(--purple-light);
  border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 36px; }
.preview-img img { width: 100%; height: 100%; object-fit: cover; }
.spinner { width: 44px; height: 44px; border: 3px solid var(--border);
  border-top-color: var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.steps { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.step { display: flex; align-items: center; gap: 14px; font-size: 15px; color: var(--hint); }
.step.active { color: var(--purple); font-weight: 500; }
.step.done { color: var(--text); }
.step-icon { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.step.active .step-icon { border-color: var(--purple); background: var(--purple-light); color: var(--purple); }
.step.done .step-icon { border-color: var(--green); background: var(--green-light); color: var(--green); }
.err-box { background: #FCEBEB; color: #A32D2D; border-radius: 10px;
  padding: 14px 16px; font-size: 14px; line-height: 1.6; display: none; text-align: center; width: 100%; }
.btn-retry { display: none; padding: 12px 28px; background: var(--purple); color: white;
  border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 4px; }

/* Read */
.read-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.passage-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; }
.passage-meta { font-size: 11px; color: var(--hint); text-transform: uppercase;
  letter-spacing: 0.8px; margin-bottom: 16px; }

/* Title line */
.passage-title { font-size: 22px; font-weight: 700; color: var(--text);
  margin-bottom: 20px; text-align: center; line-height: 1.6; }
.passage-title .char { cursor: pointer; border-radius: 4px; padding: 1px 2px; }

/* Body text */
.chinese-text { font-size: 22px; line-height: 2.4; color: var(--text); }
.para { margin-bottom: 1.2em; display: flex; flex-wrap: wrap; }
.para:last-child { margin-bottom: 0; }
.char { display: inline; border-radius: 4px; padding: 1px 2px;
  transition: background 0.06s, color 0.06s; cursor: pointer; }
.char.hl { background: var(--purple-light); color: var(--purple-mid); font-weight: 700; }
.char.read { color: var(--hint); }

/* Player */
.player { background: var(--surface); border-top: 1px solid var(--border);
  padding: 16px 20px 32px; flex-shrink: 0; }
.progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.pct { font-size: 12px; color: var(--hint); min-width: 32px; text-align: right; }
.track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.fill { height: 100%; background: var(--purple); border-radius: 2px; width: 0%; transition: width 0.1s; }
.controls { display: flex; align-items: center; justify-content: space-between; }
.ctrl { background: none; border: none; cursor: pointer; color: var(--muted);
  padding: 8px; border-radius: 50%; display: flex; }
.ctrl svg { width: 24px; height: 24px; fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ctrl:active { background: var(--bg); }
.play-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--purple);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(127,119,221,0.4); }
.play-btn svg { width: 22px; height: 22px; fill: white; }
.play-btn:active { opacity: 0.9; }
.speeds { display: flex; gap: 8px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }
.spd { font-size: 13px; padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; }
.spd.on { background: var(--purple-light); color: var(--purple-mid);
  border-color: rgba(127,119,221,0.4); font-weight: 500; }
.tts-warn { margin: 0 20px 12px; padding: 12px; background: #FAEEDA; border-radius: 10px;
  font-size: 13px; color: #854F0B; display: none; line-height: 1.5; }
::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div class="screen active" id="s-home">
  <div class="bar"><span class="bar-title">读一读 · Dú Yī Dú</span></div>
  <div class="home-body">
    <div class="hero">
      <div class="hero-icon">📖</div>
      <h1>扫描课文，<br>一起来读！</h1>
      <p>拍一张课文或功课的照片<br>App 帮你朗读，每个字同步高亮。</p>
    </div>
    <button class="btn-primary" onclick="document.getElementById('inp-cam').click()">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      拍照扫描
    </button>
    <input id="inp-cam" type="file" accept="image/*" capture="environment" style="display:none" onchange="onFileChosen(event)">
    <div class="divider"><div class="divider-line"></div><span>或</span><div class="divider-line"></div></div>
    <button class="btn-secondary" onclick="document.getElementById('inp-gallery').click()">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      从相册选择
    </button>
    <input id="inp-gallery" type="file" accept="image/*" style="display:none" onchange="onFileChosen(event)">
    <div class="tip">
      <strong>💡 怎么用？</strong>
      对准课本或功课拍照，App 会朗读每一个字，同步高亮显示，帮助跟读练习。
    </div>
  </div>
</div>

<!-- PROCESSING -->
<div class="screen" id="s-proc">
  <div class="bar"><span class="bar-title">识别中…</span></div>
  <div class="proc-body">
    <div class="preview-img" id="preview">📄</div>
    <div class="spinner" id="spinner"></div>
    <div class="steps">
      <div class="step" id="s1"><div class="step-icon">1</div><span>压缩图片</span></div>
      <div class="step" id="s2"><div class="step-icon">2</div><span>OCR 识别文字</span></div>
      <div class="step" id="s3"><div class="step-icon">3</div><span>整理段落</span></div>
      <div class="step" id="s4"><div class="step-icon">4</div><span>准备朗读</span></div>
    </div>
    <div class="err-box" id="err-box"></div>
    <button class="btn-retry" id="btn-retry" onclick="goTo('s-home')">← 重试</button>
  </div>
</div>

<!-- READ -->
<div class="screen" id="s-read">
  <div class="bar">
    <button class="back" onclick="stopAll();goTo('s-home')">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="bar-title">跟读练习</span>
  </div>
  <div class="read-body">
    <div class="passage-wrap">
      <div class="passage-meta">已扫描 · 点击任何字可跳转</div>
      <div id="title-line" class="passage-title" style="display:none"></div>
      <div class="chinese-text" id="chinese-text"></div>
    </div>
    <div class="tts-warn" id="tts-warn">⚠️ 请用 Safari 或 Chrome 打开以支持中文朗读。</div>
    <div class="player">
      <div class="progress-row">
        <div class="track"><div class="fill" id="fill"></div></div>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="controls">
        <button class="ctrl" onclick="restart()" title="从头">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
        </button>
        <button class="play-btn" id="play-btn" onclick="togglePlay()">
          <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="ctrl" onclick="rewind()" title="后退">
          <svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
        </button>
      </div>
      <div class="speeds">
        <button class="spd on"  onclick="setSpd(0.5,this)">很慢 ×0.5</button>
        <button class="spd"     onclick="setSpd(0.7,this)">慢 ×0.7</button>
        <button class="spd"     onclick="setSpd(1.0,this)">正常</button>
        <button class="spd"     onclick="setSpd(1.2,this)">快 ×1.2</button>
      </div>
    </div>
  </div>
</div>

</div><!-- #app -->
<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
var GV_KEY = 'AIzaSyAlQi0CiHtnIwdEOqBTsdgMEM6NExHKCzM';

// ─── STATE ────────────────────────────────────────────────────────────────────
var chars      = [];   // [{ch, el}]  all renderable characters
var isPlaying  = false;
var speed      = 0.5;
var curIdx     = -1;
var timings    = [];   // [{start, end}] ms from utterance start, parallel to chars
var hlTimer    = null;
var utter      = null;
var tStart     = 0;

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function goTo(id) {
  document.querySelectorAll('.screen').forEach(function(s) {
    s.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}

// ─── FILE INPUT ───────────────────────────────────────────────────────────────
function onFileChosen(e) {
  var file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  var reader = new FileReader();
  reader.onload = function(ev) { processImage(ev.target.result); };
  reader.readAsDataURL(file);
}

// ─── PROCESSING ───────────────────────────────────────────────────────────────
function setStep(n, state) {
  var el = document.getElementById('s' + n);
  el.className = 'step ' + state;
  el.querySelector('.step-icon').textContent = state === 'done' ? '✓' : String(n);
}

function showErr(msg) {
  document.getElementById('spinner').style.display = 'none';
  var box = document.getElementById('err-box');
  box.style.display = 'block';
  box.textContent = msg;
  document.getElementById('btn-retry').style.display = 'block';
}

function processImage(dataURL) {
  goTo('s-proc');

  // Reset processing UI
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('btn-retry').style.display = 'none';
  document.getElementById('preview').innerHTML = '<img src="' + dataURL + '" style="width:100%;height:100%;object-fit:cover;">';
  [1,2,3,4].forEach(function(n) { setStep(n, ''); });

  // Compress then OCR
  compressImage(dataURL, 1200, 0.82, function(compressed) {
    setStep(1, 'done');
    setStep(2, 'active');
    callVisionAPI(compressed);
  });
}

function compressImage(dataURL, maxPx, quality, cb) {
  setStep(1, 'active');
  var img = new Image();
  var timer = setTimeout(function() { cb(dataURL); }, 5000);
  img.onload = function() {
    clearTimeout(timer);
    var w = img.width, h = img.height;
    if (w > maxPx || h > maxPx) {
      if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
      else       { w = Math.round(w * maxPx / h); h = maxPx; }
    }
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(c.toDataURL('image/jpeg', quality));
  };
  img.onerror = function() { clearTimeout(timer); cb(dataURL); };
  img.src = dataURL;
}

function callVisionAPI(dataURL) {
  var base64 = dataURL.split(',')[1];
  var controller = new AbortController();
  var timeout = setTimeout(function() { controller.abort(); }, 20000);

  fetch('https://vision.googleapis.com/v1/images:annotate?key=' + GV_KEY, {
    method: 'POST',
    signal: controller.signal,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      requests: [{
        image: { content: base64 },
        features: [{ type: 'TEXT_DETECTION', maxResults: 1 }],
        imageContext: { languageHints: ['zh-Hans', 'zh-Hant'] }
      }]
    })
  })
  .then(function(r) {
    clearTimeout(timeout);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(data) {
    if (data.error) throw new Error('API: ' + data.error.message + ' (' + data.error.code + ')');
    var ann = data.responses && data.responses[0] && data.responses[0].textAnnotations;
    if (!ann || ann.length === 0) throw new Error('未识别到文字，请确保光线充足、图片清晰。');
    var raw = ann[0].description;
    setStep(2, 'done');
    setStep(3, 'active');
    var parsed = parsePassage(raw);
    setStep(3, 'done');
    setStep(4, 'active');
    setTimeout(function() {
      setStep(4, 'done');
      setTimeout(function() {
        goTo('s-read');
        buildPassage(parsed);
      }, 250);
    }, 300);
  })
  .catch(function(err) {
    clearTimeout(timeout);
    var msg = err.name === 'AbortError' ? '请求超时，请检查网络后重试。' : ('识别失败：' + err.message);
    showErr(msg);
  });
}

// ─── PASSAGE PARSING ─────────────────────────────────────────────────────────
// Keeps CJK characters AND Chinese punctuation. Everything else (pinyin, numbers, latin) dropped.
var CJK_PUNCT = "。，？！、；：…—「」『』（）·“”‘’";

function isCJK(ch) {
  var c = ch.codePointAt(0);
  return (c >= 0x4E00 && c <= 0x9FFF)
      || (c >= 0x3400 && c <= 0x4DBF)
      || (c >= 0x20000 && c <= 0x2A6DF);
}

function isKeep(ch) {
  return isCJK(ch) || CJK_PUNCT.indexOf(ch) >= 0;
}

function parsePassage(raw) {
  // 1. Split OCR output into lines
  var lines = raw.split('\n');

  // 2. For each line keep only Chinese chars + punctuation
  var cleaned = [];
  for (var i = 0; i < lines.length; i++) {
    var out = '';
    for (var j = 0; j < lines[i].length; j++) {
      if (isKeep(lines[i][j])) out += lines[i][j];
    }
    if (out.length > 0) cleaned.push(out);
  }

  if (cleaned.length === 0) return { title: '', paras: [] };

  var sentEnders = '。！？';

  // 3. Title detection: scan first 3 lines for the longest short non-sentence line
  //    Short = 2–8 chars, does not end with sentence-ending punctuation
  //    We also strip ALL other short non-sentence prefix lines (labels, series names)
  var titleText = '';
  var shortPrefixIdxs = {};
  for (var i = 0; i < Math.min(3, cleaned.length); i++) {
    var l = cleaned[i];
    if (l.length >= 2 && l.length <= 8 && sentEnders.indexOf(l[l.length-1]) < 0) {
      shortPrefixIdxs[i] = true;
      if (l.length > titleText.length) titleText = l;
    }
  }

  // 4. Build body lines (everything not in shortPrefixIdxs)
  //    Also drop any remaining short non-sentence lines (page numbers, chapter labels)
  var bodyLines = [];
  for (var i = 0; i < cleaned.length; i++) {
    if (shortPrefixIdxs[i]) continue;
    var l = cleaned[i];
    // Drop short non-sentence lines in the body too (e.g. "52", "第四课")
    if (l.length < 5 && sentEnders.indexOf(l[l.length-1]) < 0) continue;
    bodyLines.push(l);
  }

  // 5. Group body lines into paragraphs
  //    A paragraph closes when a line ends with 。！？
  var paras = [];
  var cur = '';
  for (var i = 0; i < bodyLines.length; i++) {
    cur += bodyLines[i];
    if (sentEnders.indexOf(bodyLines[i][bodyLines[i].length-1]) >= 0) {
      paras.push(cur);
      cur = '';
    }
  }
  if (cur.length > 0) paras.push(cur);

  return { title: titleText, paras: paras };
}

// ─── BUILD READ-ALONG UI ──────────────────────────────────────────────────────
function buildPassage(parsed) {
  chars = [];
  curIdx = -1;
  isPlaying = false;
  setPlayIcon(false);
  document.getElementById('fill').style.width = '0%';
  document.getElementById('pct').textContent = '0%';

  // Title
  var titleEl = document.getElementById('title-line');
  titleEl.innerHTML = '';
  if (parsed.title) {
    titleEl.style.display = 'block';
    parsed.title.split('').forEach(function(ch) {
      var sp = document.createElement('span');
      sp.className = 'char';
      sp.textContent = ch;
      var idx = chars.length;
      sp.onclick = function() { seekTo(idx); };
      titleEl.appendChild(sp);
      chars.push({ ch: ch, el: sp });
    });
  } else {
    titleEl.style.display = 'none';
  }

  // Body paragraphs
  var bodyEl = document.getElementById('chinese-text');
  bodyEl.innerHTML = '';
  parsed.paras.forEach(function(paraText) {
    var div = document.createElement('div');
    div.className = 'para';
    paraText.split('').forEach(function(ch) {
      var sp = document.createElement('span');
      sp.className = 'char';
      sp.textContent = ch;
      var idx = chars.length;
      sp.onclick = function() { seekTo(idx); };
      div.appendChild(sp);
      chars.push({ ch: ch, el: sp });
    });
    bodyEl.appendChild(div);
  });
}

// ─── PLAYBACK ─────────────────────────────────────────────────────────────────
// Build per-character timing estimates.
// Durations tuned so pauses at punctuation sound natural.
var PAUSE = {
  '。': 580, '！': 580, '？': 580,  // sentence end — full breath
  '，': 300, '；': 300, '：': 300,  // clause pause
  '、': 180,                         // list comma
  '…': 420, '—': 350,               // ellipsis / dash
  '"': 80,  '"': 80,                 // quotes — brief
  '\u2018': 80, '\u2019': 80
};
var CHAR_MS = 175; // ms per regular character at rate=1.0

function buildTimings(fromIdx) {
  var t = [];
  var cursor = 0;
  for (var i = fromIdx; i < chars.length; i++) {
    var ch = chars[i].ch;
    var dur = (PAUSE[ch] !== undefined ? PAUSE[ch] : CHAR_MS) / speed;
    t.push({ start: cursor, end: cursor + dur });
    cursor += dur;
  }
  return t;
}

function speak(fromIdx) {
  if (!window.speechSynthesis) {
    document.getElementById('tts-warn').style.display = 'block';
    return;
  }
  window.speechSynthesis.cancel();
  var text = chars.slice(fromIdx).map(function(c) { return c.ch; }).join('');
  utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = speed;
  utter.pitch = 1.05;
  var voices = window.speechSynthesis.getVoices();
  var v = voices.find(function(v) { return v.lang === 'zh-CN' && v.localService; })
       || voices.find(function(v) { return v.lang === 'zh-CN'; })
       || voices.find(function(v) { return v.lang.startsWith('zh'); });
  if (v) utter.voice = v;

  timings = buildTimings(fromIdx);
  utter.onstart = function() {
    tStart = performance.now();
    runHL(fromIdx);
  };
  utter.onend = function() {
    cancelAnimationFrame(hlTimer);
    chars.forEach(function(c) { c.el.classList.remove('hl'); c.el.classList.add('read'); });
    document.getElementById('fill').style.width = '100%';
    document.getElementById('pct').textContent = '100%';
    isPlaying = false;
    setPlayIcon(false);
  };
  utter.onerror = function(e) {
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    document.getElementById('tts-warn').style.display = 'block';
    isPlaying = false; setPlayIcon(false);
  };
  window.speechSynthesis.speak(utter);
}

function runHL(fromIdx) {
  cancelAnimationFrame(hlTimer);
  var total = chars.length;
  function tick() {
    var elapsed = performance.now() - tStart;
    var sliceIdx = 0;
    for (var i = 0; i < timings.length; i++) {
      if (elapsed >= timings[i].start) sliceIdx = i;
      else break;
    }
    var absIdx = fromIdx + sliceIdx;
    if (absIdx !== curIdx) {
      if (curIdx >= 0) { chars[curIdx].el.classList.remove('hl'); chars[curIdx].el.classList.add('read'); }
      for (var i = fromIdx; i < absIdx; i++) {
        chars[i].el.classList.remove('hl'); chars[i].el.classList.add('read');
      }
      if (absIdx < chars.length) {
        chars[absIdx].el.classList.remove('read'); chars[absIdx].el.classList.add('hl');
        chars[absIdx].el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      curIdx = absIdx;
      var pct = Math.round(((absIdx + 1) / total) * 100);
      document.getElementById('fill').style.width = pct + '%';
      document.getElementById('pct').textContent = pct + '%';
    }
    if (isPlaying) hlTimer = requestAnimationFrame(tick);
  }
  hlTimer = requestAnimationFrame(tick);
}

function togglePlay() {
  if (isPlaying) { pause(); return; }
  if (curIdx >= chars.length - 1) { restart(); return; }
  isPlaying = true;
  setPlayIcon(true);
  speak(Math.max(0, curIdx < 0 ? 0 : curIdx));
}

function pause() {
  isPlaying = false;
  setPlayIcon(false);
  cancelAnimationFrame(hlTimer);
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

function stopAll() {
  isPlaying = false;
  setPlayIcon(false);
  cancelAnimationFrame(hlTimer);
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

function restart() {
  stopAll();
  curIdx = -1;
  chars.forEach(function(c) { c.el.classList.remove('hl', 'read'); });
  document.getElementById('fill').style.width = '0%';
  document.getElementById('pct').textContent = '0%';
  setTimeout(function() { isPlaying = true; setPlayIcon(true); speak(0); }, 80);
}

function rewind() {
  var to = Math.max(0, (curIdx < 0 ? 0 : curIdx) - 10);
  seekTo(to);
}

function seekTo(idx) {
  stopAll();
  curIdx = idx - 1;
  chars.forEach(function(c, i) {
    c.el.classList.remove('hl', 'read');
    if (i < idx) c.el.classList.add('read');
  });
  var pct = Math.round((idx / chars.length) * 100);
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '%';
  setTimeout(function() { isPlaying = true; setPlayIcon(true); speak(idx); }, 80);
}

function setSpd(s, btn) {
  speed = s;
  document.querySelectorAll('.spd').forEach(function(b) { b.classList.remove('on'); });
  btn.classList.add('on');
  if (isPlaying) { var from = Math.max(0, curIdx); stopAll(); setTimeout(function() { isPlaying = true; setPlayIcon(true); speak(from); }, 80); }
}

function setPlayIcon(playing) {
  document.getElementById('play-icon').innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="5 3 19 12 5 21 5 3"/>';
}

// Pre-load voices
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
}

// Prevent scroll-bounce outside scroll areas on iOS
document.addEventListener('touchmove', function(e) {
  if (!e.target.closest('.passage-wrap')) e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
